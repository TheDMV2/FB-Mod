name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Ant Classpath Dependencies
      run: |
        mkdir -p lib/ant
        curl -L -o lib/ant/ivy.jar https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar
        curl -L -o lib/ant/groovy-all.jar https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-all/2.4.21/groovy-all-2.4.21.jar

    - name: Pre-populate FileBot Download Cache
      run: |
        mkdir -p cache
        # Download OpenJDK 11 matching FileBot SHA256
        curl -L -o cache/openjdk-11.0.2_osx-x64_bin.tar.gz https://download.java.net/java/GA/jdk11/9/GPL/openjdk-11.0.2_osx-x64_bin.tar.gz
        
        # Download OpenJFX 11 matching FileBot SHA256
        curl -L -o cache/openjfx-11.0.2_osx-x64_bin-sdk.zip https://download2.gluonhq.com/openjfx/11.0.2/openjfx-11.0.2_osx-x64_bin-sdk.zip

    - name: Build App & Packages with Ant
      run: |
        # Create a mock 'uname' bin directory to trick inner shell calls into reporting x86_64
        mkdir -p bin_override
        echo '#!/bin/sh' > bin_override/uname
        echo 'if [ "$1" = "-m" ]; then echo "x86_64"; else /usr/bin/uname "$@"; fi' >> bin_override/uname
        chmod +x bin_override/uname

        # Run Ant with spoofed x86_64 environment and classpath
        PATH="$GITHUB_WORKSPACE/bin_override:$PATH" arch -x86_64 ant -lib lib/ant -Dos.arch=x86_64 jar

    - name: Package DMG
      run: |
        brew install create-dmg
        
        mkdir -p dmg_stage
        cp -r dist/* dmg_stage/ || cp build/libs/*.jar dmg_stage/ || cp *.jar dmg_stage/
        
        create-dmg \
          --volname "FileBot-Mod" \
          --window-size 500 300 \
          "FileBot-Mod-macOS.dmg" \
          "dmg_stage"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileBot-Mod-macOS-DMG
        path: FileBot-Mod-macOS.dmg
