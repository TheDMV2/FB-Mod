name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # Uses an active macOS runner

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Download OpenJDK Dependency Cache
      run: |
        mkdir -p cache
        curl -L -o cache/openjdk-11.0.2_osx-x64_bin.tar.gz https://download.java.net/java/GA/jdk11/28/GBL/openjdk-11.0.2_osx-x64_bin.tar.gz

    - name: Build JAR / Distribution with Ant
      run: |
        ant jar

    - name: Package DMG
      run: |
        brew install create-dmg
        
        # Package built JARs/distribution into the DMG
        mkdir -p dmg_stage
        cp -r dist/* dmg_stage/ || cp build/libs/*.jar dmg_stage/ || cp *.jar dmg_stage/
        
        create-dmg \
          --volname "FileBot-Mod" \
          --window-size 500 300 \
          "FileBot-Mod-macOS.dmg" \
          "dmg_stage"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileBot-Mod-macOS-DMG
        path: FileBot-Mod-macOS.dmg
