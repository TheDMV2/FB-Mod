name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # Uses x86_64 Intel Mac runner required by FileBot's build.xml

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Fetch Build Dependencies
      run: |
        # Runs the dependency fetching task if present in build.xml, otherwise fails silently and continues
        ant resolve || ant fetch-dependencies || ant fetch || true

    - name: Build JAR / Distribution with Ant
      run: |
        ant jar

    - name: Package DMG
      run: |
        brew install create-dmg
        
        # Package built output
        mkdir -p dmg_stage
        cp -r dist/* dmg_stage/ || cp build/libs/*.jar dmg_stage/ || cp *.jar dmg_stage/
        
        create-dmg \
          --volname "FileBot-Mod" \
          --window-size 500 300 \
          "FileBot-Mod-macOS.dmg" \
          "dmg_stage"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileBot-Mod-macOS-DMG
        path: FileBot-Mod-macOS.dmg
